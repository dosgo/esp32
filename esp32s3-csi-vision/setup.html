<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>配网 · ESP32-S3 CSI</title>
<style>
  :root{
    --bg:#070b14; --panel:#0d1420; --panel2:#111a28; --line:#1b2637;
    --text:#dbe6f5; --dim:#6f829e; --accent:#22d3ee; --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 20% -10%, #10233a 0%, var(--bg) 55%);
    color:var(--text); min-height:100vh; padding:18px;
    font:13px/1.6 ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px}
  h1{font-size:15px; font-weight:600; letter-spacing:.05em}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim); font-size:11.5px; letter-spacing:.08em}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:10px; padding:16px;
  }
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; font-size:12px}
  .row + .row{border-top:1px solid #131c2a}
  .row .k{color:var(--dim)}
  .row .v{font-weight:600}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  label{display:block; font-size:11px; color:var(--dim); letter-spacing:.08em; margin-bottom:6px}
  input{
    width:100%; background:#0a111c; color:var(--text);
    border:1px solid var(--line); border-radius:7px; padding:10px 12px;
    font:inherit; font-size:13px; outline:none;
  }
  input:focus{border-color:var(--accent)}
  .field + .field{margin-top:14px}
  button{
    width:100%; margin-top:16px; padding:11px; border-radius:7px; cursor:pointer;
    background:linear-gradient(180deg,#1b4a5c,#123542); color:#a5f3fc;
    border:1px solid #2b6d84; font:inherit; font-size:13px; font-weight:600; letter-spacing:.05em;
  }
  button:hover{border-color:var(--accent); color:#fff}
  button:disabled{opacity:.5; cursor:default}
  .ghost{
    width:auto; margin:0; display:inline-block; padding:6px 12px;
    background:transparent; border:1px solid var(--line); color:var(--dim);
    font-size:11.5px; font-weight:400;
  }
  .ghost:hover{border-color:var(--bad); color:var(--bad)}
  .tip{color:#4a5b74; font-size:11px; line-height:1.8; margin-top:10px}
  #msg{display:none; margin-top:12px; padding:9px 12px; border-radius:7px; font-size:12px}
  #msg.show{display:block}
  #msg.ok{background:#0c2a22; border:1px solid #1f6b52; color:#7fe3bf}
  #msg.err{background:#2a1214; border:1px solid #6b2028; color:#f7a0a6}
  .bar{height:3px; background:#16202f; border-radius:2px; overflow:hidden; margin-top:10px; display:none}
  .bar.show{display:block}
  .bar i{display:block; height:100%; width:40%; background:var(--accent); animation:sl 1.1s linear infinite}
  @keyframes sl{ from{transform:translateX(-100%)} to{transform:translateX(250%)} }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>ESP32-S3 <span>配网</span></h1>
    <div class="sub">填 2.4GHz Wi-Fi，保存后自动连接</div>
  </div>

  <div class="card" id="statusCard">
    <div class="row"><span class="k">路由器连接</span><span class="v" id="staState">读取中…</span></div>
    <div class="row"><span class="k">IP 地址</span><span class="v" id="ip">--</span></div>
    <div class="row"><span class="k">信号强度</span><span class="v" id="rssi">--</span></div>
    <div class="row"><span class="k">芯片温度</span><span class="v" id="temp">--</span></div>
  </div>

  <div class="card">
    <form id="f" onsubmit="return doSave(event)">
      <div class="field">
        <label>Wi-Fi 名称（SSID）</label>
        <input id="ssid" name="ssid" autocomplete="off" autocapitalize="none"
               spellcheck="false" placeholder="家里 2.4G 的 Wi-Fi 名" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="pass" name="pass" type="password" autocomplete="off"
               placeholder="留空 = 开放网络">
      </div>
      <button type="submit" id="btn">保存并连接</button>
      <div class="bar" id="bar"><i></i></div>
      <div id="msg"></div>
    </form>
    <div class="tip">
      只能连 <b>2.4GHz</b>，ESP32-S3 不支持 5GHz。<br>
      双频合一的路由器有时会协商到 5G 导致连不上，这种情况请单独开一个 2.4G 的 SSID。
    </div>
  </div>

  <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <span class="tip" style="margin:0">清除已保存的 Wi-Fi（回到未配网状态）</span>
    <button class="ghost" id="clr">清除</button>
  </div>

  <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <span class="tip" style="margin:0">不配网也能用：直接看 CSI 成像</span>
    <a href="/" style="color:var(--accent);font-size:12px;text-decoration:none">去主页 →</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let polling = null;

function fmtTemp(dc){
  if (dc === null || dc === undefined || dc === 0) return '--';
  return (dc / 10).toFixed(1) + ' ℃';
}

async function refresh(){
  try{
    const r = await fetch('/status', {cache:'no-store'});
    const j = await r.json();

    const st = $('staState');
    if (j.sta) { st.textContent = '已连接'; st.className = 'v ok'; }
    else { st.textContent = '未连接'; st.className = 'v warn'; }

    $('ip').textContent   = j.sta ? 'http://' + j.ip + '/' : '--';
    $('rssi').textContent = j.sta ? j.rssi + ' dBm' : '--';
    $('temp').textContent = fmtTemp(j.temp);
    return j;
  }catch(e){
    $('staState').textContent = '读取失败';
    $('staState').className = 'v bad';
    return null;
  }
}

function say(text, cls){
  const m = $('msg');
  m.textContent = text;
  m.className = 'show ' + cls;
}

function doSave(ev){
  ev.preventDefault();
  const s = $('ssid').value.trim();
  const p = $('pass').value;
  if (!s) { say('SSID 不能为空', 'err'); return false; }

  $('btn').disabled = true;
  $('bar').classList.add('show');
  say('已提交，正在连接…', 'ok');

  // GET 提交：简单，且不用处理 multipart
  location.href = '/save?ssid=' + encodeURIComponent(s) + '&pass=' + encodeURIComponent(p);
  return false;
}

// 保存页返回后（或者本来就有配置时）持续轮询，一连上就跳主页
function watchConnect(){
  let n = 0;
  polling = setInterval(async () => {
    const j = await refresh();
    n++;
    if (j && j.sta) {
      clearInterval(polling);
      say('连接成功，正在打开主页…', 'ok');
      setTimeout(() => location.href = '/', 800);
    } else if (n > 40) {          // 20 秒还没连上
      clearInterval(polling);
      $('btn').disabled = false;
      $('bar').classList.remove('show');
      say('还没连上。检查：① 是不是 2.4G ② 密码对不对 ③ 信号够不够', 'err');
    }
  }, 500);
}

$('clr').onclick = async () => {
  if (!confirm('确定清除已保存的 Wi-Fi？清除后需要重新配网。')) return;
  await fetch('/clear', {cache:'no-store'});
  say('已清除，正在重启…', 'ok');
  setTimeout(() => location.reload(), 2500);
};

refresh();
// 从 /save 跳回来时地址带 ?saved=1，说明刚提交过，开始盯着连接结果
if (location.search.includes('saved=1')) {
  say('已保存，正在连接…', 'ok');
  $('bar').classList.add('show');
  $('btn').disabled = true;
  watchConnect();
}
</script>
</body>
</html>
