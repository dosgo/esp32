[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
    "-C", "link-arg=-Wl,-Tlinkall.x",
    "-C", "link-arg=-nostartfiles",
]

[unstable]
build-std = ["alloc", "core"]

[env]
#, ESP_LOG 级别
#
# 【info → error，2026-10-28】
#
# esp-println 走的是 USB-Serial-JTAG，**当主机端没有在读、FIFO 积压时，
# 写日志会阻塞**。而 mic_task 每秒都要打一行 `[mic] rms=...`，
# 累积几秒就把整个任务卡死 —— 现象是「设备跑十几秒后串口突然全静默」。
#
# 关键证据：卡死之后 ARP 仍然能响应（网络任务不打印，所以没被卡住），
# 说明板子根本没死，只是所有会打印日志的任务都被堵在了 write 上。
#
# 正常使用时电脑不会一直读串口，所以只保留 error 级别：
# 真有 panic/致命错误才输出，日常零日志，设备不会被自己的日志憋死。
# 需要排查时临时改回 "info" 即可，但要记得同时开着串口读。
ESP_LOG = "error"
