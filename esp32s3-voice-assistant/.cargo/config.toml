[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
    "-C", "link-arg=-Wl,-Tlinkall.x",
    "-C", "link-arg=-nostartfiles",
]

[unstable]
build-std = ["alloc", "core"]

[env]
#, ESP_LOG 级别
#
# 【这一条踩过一个很贵的坑，记下来】
#
# esp-println 走 USB-Serial-JTAG。**主机端不在读串口时，FIFO 一满，write 就永久
# 阻塞** —— 阻塞发生在哪个任务，哪个任务就停住。实测现象：设备启动到一半打印
# 一句话就再也不动了，串口零输出、ping 也不通，但 USB-JTAG 还能烧写（芯片根本
# 没那么死）。之前所有「跑一阵就卡死」的锅，一大半是这个。
#
# 更坑的是：`println!`（esp_println::println）**绕过了 log 系统**，不受
# ESP_LOG 控制。所以早先把 ESP_LOG 设成 error 也照样卡 —— main.rs 里那 52 个
# println! 还在往外吐。2026-10-28 晚已全部换成 log::info!，才真正受这个开关管。
#
# 现在取 warn：正常运行几乎零输出（只有 codec 初始化失败、声道校准、断线重连
# 计数这几条真正要紧的），设备可以长期跑，不会被自己的日志憋死。
#
# **排查问题时要改回 "info" 或 "debug"，但务必让电脑一直挂着读串口**
# （`cargo run --release` 自带 monitor 即可），否则还是会堵。
ESP_LOG = "error"
