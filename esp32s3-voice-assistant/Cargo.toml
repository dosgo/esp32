[package]
name = "esp32s3-voice-assistant"
version = "0.1.0"
edition = "2021"
resolver = "2"

# ============================================================================
# ESP32-S3 语音助手（纯 Rust no_std）
#
# 硬件：ESP32-S3R8（8MB OPI PSRAM + 16MB Flash）/ ES8311 codec / NS4150B 功放
#       / 1.54" 240x240 ST7789 / QMI8658 IMU / MicroSD / 锂电池管理
#
# 链路：
#   麦克风 --I2S--> ESP32 --WebSocket(PCM)--> PC 网关(Python)
#                                              ├─ ASR   (云 API)
#                                              ├─ LLM   (DeepSeek)
#                                              └─ TTS   (云 API)
#   ESP32 <--WebSocket(PCM)-- 网关
#
# 设计取舍：设备端不做 Opus 编解码，直接传 16kHz/16bit/mono PCM。
# 16kHz*2B = 32KB/s，Wi-Fi 完全吃得下，换来的是零 C 依赖、零编解码延迟。
# ============================================================================

[dependencies]
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "proto-ipv4",
    "medium-ethernet",
    "dhcpv4",
    "dns",
    "tcp",
    "udp",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embedded-io-async = "0.7"
# 驱动层统一用 embedded-hal 1.0 的 trait，好处是 codec/IMU/触摸能塞进
# embedded-hal-bus 的共享设备里共用同一条 I2C
embedded-hal = "1.0"
# TF 卡：块设备层 + FAT 无关的卡初始化（SPI 模式）
embedded-sdmmc = "0.10"
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
# 网页配置存 flash（0x9000 nvs 区），掉电不丢、重烧不丢
esp-storage = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }
embedded-storage = "0.3.1"
# 热点侧要自己跑 DHCP，否则手机连上会显示"无互联网"然后自动断开
esp-hal-dhcp-server = "0.4.3"
# 日志走原生 USB-Serial-JTAG（GPIO19/20）
# 不能用默认的 auto：它靠读 USB_DEVICE_INT_RAW 的 SOF 标志判断，
# 而 esp-println 0.18 给 ESP32-S3 的地址写的是 0x60038000（少了 +0x08 偏移），
# 判断永远为假，日志会全部走去 UART0（GPIO43/44），USB 口一行都看不到。
esp-println = { version = "0.18.0", default-features = false, features = [
    "esp32s3",
    "log-04",
    "jtag-serial",
    "critical-section",
    "colors",
] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "esp32s3",
    "wifi",
    "unstable",
] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "esp-radio"] }
heapless = "0.9.3"
static_cell = "2.1.1"
log = "0.4.34"
# WebSocket 握手要 SHA1(Sec-WebSocket-Key + GUID)，纯 no_std
sha1 = { version = "0.11", default-features = false }
# 直接点 SENS 寄存器读片上温度：esp-hal 1.2.2 的 tsens 模块不带 S3。
# 版本必须跟 esp-radio 1.0-beta.1 内部用的一致（0.37），否则寄存器类型对不上。
esp32s3 = "0.37"
# no_std 没有 log10，AEC 算 ERLE 要用
libm = "0.2"
# 试验：bare-metal 版 esp-sr（AEC/VAD/唤醒词），vendor 了官方 .a + 自写 FreeRTOS 桩
ember_esp_sr = { version = "0.1.0", features = ["esp32s3"] }

# ---- 1.54" ST7789 240x240 屏 ----
mipidsi = { version = "0.10", default-features = false }
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"

[profile.release]
opt-level = "s"
codegen-units = 1

# esp_sr_sys 本地补丁：dl_lib 的对象把 .literal 段改名为 .text。
# 原因：Xtensa 的 l32r 只能寻址 ±256KB，而 libdl_lib.a 是预编译的，
# 它的汇编被放进 IRAM、literal 留在 flash，两者差 30MB，AEC 一引用就炸。
# 改名后代码和 literal 落在同一输出段，距离由段内偏移决定，与固件大小无关。
[patch.crates-io]
esp_sr_sys = { path = "vendor/esp_sr_sys" }
