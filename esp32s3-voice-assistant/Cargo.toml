[package]
name = "esp32s3-voice-assistant"
version = "0.1.0"
edition = "2021"
resolver = "2"

# ============================================================================
# ESP32-S3 语音助手（纯 Rust no_std）
#
# 硬件：ESP32-S3R8（8MB OPI PSRAM + 16MB Flash）/ ES8311 codec / NS4150B 功放
#       / 1.54" 240x240 ST7789 / QMI8658 IMU / MicroSD / 锂电池管理
#
# 链路：
#   麦克风 --I2S--> ESP32 --WebSocket(PCM)--> PC 网关(Python)
#                                              ├─ ASR   (云 API)
#                                              ├─ LLM   (DeepSeek)
#                                              └─ TTS   (云 API)
#   ESP32 <--WebSocket(PCM)-- 网关
#
# 设计取舍：设备端不做 Opus 编解码，直接传 16kHz/16bit/mono PCM。
# 16kHz*2B = 32KB/s，Wi-Fi 完全吃得下，换来的是零 C 依赖、零编解码延迟。
# ============================================================================

[dependencies]
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "proto-ipv4",
    "medium-ethernet",
    "dhcpv4",
    "dns",
    "tcp",
    "udp",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embedded-io-async = "0.7"
# 驱动层统一用 embedded-hal 1.0 的 trait，好处是 codec/IMU/触摸能塞进
# embedded-hal-bus 的共享设备里共用同一条 I2C
embedded-hal = "1.0"
# TF 卡：块设备层 + FAT 无关的卡初始化（SPI 模式）
embedded-sdmmc = "0.10"
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "esp32s3",
    "wifi",
    "unstable",
] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "esp-radio"] }
heapless = "0.9.3"
static_cell = "2.1.1"
log = "0.4.34"
# WebSocket 握手要 SHA1(Sec-WebSocket-Key + GUID)，纯 no_std
sha1 = { version = "0.11", default-features = false }

# ---- 1.54" ST7789 240x240 屏 ----
mipidsi = { version = "0.10", default-features = false }
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"

[profile.release]
opt-level = "s"
codegen-units = 1
