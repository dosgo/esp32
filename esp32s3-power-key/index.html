<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ESP32-S3 电源键 · 远程键鼠</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #14161a; color: #e6e8ea;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
    overflow: hidden; display: flex; flex-direction: column;
  }
  button {
    font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid #3a3f49; background: #262a32; color: #e6e8ea; cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #30353f; }
  button.on { background: #8a5a00; border-color: #8a5a00; color: #fff; }
  button.wide { padding: 5px 14px; }
  #wifiLink {
    font-size: 12px; padding: 5px 10px; border-radius: 6px; text-decoration: none;
    border: 1px solid #2a5a66; background: #16323a; color: #7fd8ea; white-space: nowrap;
  }
  #wifiLink:hover { background: #1d404a; }

  /* ---------- 顶栏 ---------- */
  #bar {
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    padding: 5px 8px; background: #1c1f25; border-bottom: 1px solid #2a2e36;
    font-size: 11px; flex: none; min-width: 0;
  }
  #bar button { padding: 4px 7px; font-size: 11px; }
  #bar #wifiLink { padding: 4px 7px; font-size: 11px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #d9534f; flex: none; }
  #dot.on { background: #5cb85c; }
  #dot.warn { background: #f0ad4e; }
  .sp { flex: 1; }
  #ip { color: #7d838d; font-family: ui-monospace, Consolas, monospace; }

  /* ---------- 鼠标区 ---------- */
  #mouse { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 6px 10px; }
  #pad {
    width: 100%; height: clamp(64px, 13vh, 150px);
    background: radial-gradient(circle at 50% 40%, #1e2228 0%, #14161a 70%);
    border: 1px dashed #2a2e36; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: crosshair; position: relative; overflow: hidden;
  }
  #pad.live { cursor: none; border-color: #2d6a4f; border-style: solid; }
  #padhint { color: #6f7681; font-size: 12px; text-align: center; padding: 8px; }
  #pad.live #padhint { display: none; }
  #mbtns { display: flex; flex-direction: row; gap: 6px; width: 100%; }
  #mbtns button { flex: 1 1 0; min-width: 0; height: 30px; font-size: 12px; padding: 0 4px; }

  /* ---------- 键盘 ---------- */
  #kbwrap { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column;
            padding: 0 8px 6px; gap: 4px; }
  #media { display: flex; flex-wrap: wrap; gap: 4px; flex: none; }
  #media button { font-size: 11px; padding: 3px 7px; line-height: 1.3; }
  #kb { display: flex; gap: 6px; flex: 1; min-height: 0; min-width: 0; }
  #main { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; }
  .row { display: flex; gap: 3px; flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
  .k {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px;
    background: #262a32; border: 1px solid #3a3f49; border-bottom-color: #1a1d22;
    border-radius: 5px; color: #d6dae0; cursor: pointer;
    font-size: clamp(8px, 3vw, 13px); overflow: hidden; padding: 0 2px;
    text-align: center; line-height: 1.1;
  }
  .k:hover { background: #30353f; }
  .k.down { background: #2d6a4f; border-color: #2d6a4f; color: #fff; transform: translateY(1px); }
  .k.mod.on { background: #8a5a00; border-color: #8a5a00; color: #fff; }
  .k.dim { background: #1e2127; color: #6f7681; }
  /* 键帽上下两层：上面是 Shift 后的符号，下面是主字符（长按出符号） */
  .k .alt { font-size: 0.8em; opacity: 0.5; line-height: 1; }
  .k .base { line-height: 1; }
  .k.hold { background: #2a4a6a; border-color: #2a4a6a; }

  /* ---------- 日志 ---------- */
  #log {
    flex: none; height: 46px; overflow-y: auto; background: #101216;
    border-top: 1px solid #2a2e36; padding: 5px 12px;
    font: 11px/1.6 ui-monospace, Consolas, monospace; color: #6f7681;
  }
  .hide { display: none !important; }
  @media (max-width: 560px) { #ip { display: none; } }
</style>
</head>
<body>

<div id="bar">
  <span id="dot"></span>
  <span id="st">连接中…</span>
  <span class="sp"></span>
  <span id="ip"></span>
  <button id="kbdToggle">隐藏键盘</button>
  <button id="lockMod" title="开启后修饰键不会被自动释放">锁定修饰键</button>
  <button id="capKbd" title="把本机物理键盘也转发给目标机">本机键盘</button>
  <button id="pwWake" class="wide" title="让电脑从睡眠中醒来（USB 远程唤醒）">唤醒</button>
  <button id="pwSleep" title="让电脑进入睡眠">睡眠</button>
  <button id="rel" class="wide">释放所有键</button>
  <a id="wifiLink" href="/" onclick="return goSetup(event)" title="配网 / 改 WiFi / 恢复出厂">设置</a>
</div>

<div id="mouse">
  <div id="pad"><div id="padhint">点此锁定鼠标 · Esc 解锁<br>未锁定时可直接拖动</div></div>
  <div id="mbtns">
    <button id="mL">左键</button>
    <button id="mM">中键</button>
    <button id="mR">右键</button>
    <button id="wU">▲ 滚</button>
    <button id="wD">▼ 滚</button>
  </div>
</div>

<div id="kbwrap">
  <div id="media"></div>
  <div id="kb">
    <div id="main"></div>
  </div>
</div>

<div id="log"></div>

<script>
// ============ HID usage 映射：KeyboardEvent.code -> usage (page 0x07) ============
const MAP = {
  KeyA:4, KeyB:5, KeyC:6, KeyD:7, KeyE:8, KeyF:9, KeyG:10, KeyH:11, KeyI:12, KeyJ:13,
  KeyK:14, KeyL:15, KeyM:16, KeyN:17, KeyO:18, KeyP:19, KeyQ:20, KeyR:21, KeyS:22,
  KeyT:23, KeyU:24, KeyV:25, KeyW:26, KeyX:27, KeyY:28, KeyZ:29,
  Digit1:30, Digit2:31, Digit3:32, Digit4:33, Digit5:34, Digit6:35, Digit7:36,
  Digit8:37, Digit9:38, Digit0:39,
  Enter:40, Escape:41, Backspace:42, Tab:43, Space:44,
  Minus:45, Equal:46, BracketLeft:47, BracketRight:48, Backslash:49,
  Semicolon:51, Quote:52, Backquote:53,
  Comma:54, Period:55, Slash:56, CapsLock:57,
  F1:58, F2:59, F3:60, F4:61, F5:62, F6:63, F7:64, F8:65, F9:66, F10:67, F11:68, F12:69,
  PrintScreen:70, ScrollLock:71, Pause:72, Insert:73, Home:74, PageUp:75,
  Delete:76, End:77, PageDown:78,
  ArrowRight:79, ArrowLeft:80, ArrowDown:81, ArrowUp:82,
  NumLock:83, NumpadDivide:84, NumpadMultiply:85, NumpadSubtract:86, NumpadAdd:87,
  NumpadEnter:88, Numpad1:89, Numpad2:90, Numpad3:91, Numpad4:92, Numpad5:93,
  Numpad6:94, Numpad7:95, Numpad8:96, Numpad9:97, Numpad0:98, NumpadDecimal:99,
  IntlBackslash:100, ContextMenu:101, NumpadEqual:103,
  F13:104, F14:105, F15:106, F16:107, F17:108, F18:109, F19:110, F20:111,
  F21:112, F22:113, F23:114, F24:115,
  NumpadComma:133, IntlRo:135, IntlYen:137,
  Lang1:144, Lang2:145, Lang3:146, Lang4:147, Lang5:148,
};
const MOD = {
  ControlLeft:1, ShiftLeft:2, AltLeft:4, MetaLeft:8,
  ControlRight:16, ShiftRight:32, AltRight:64, MetaRight:128,
};
// 媒体键走 Consumer Control（Usage Page 0x0C），不在键盘 page 里，必须单独 interface
const MEDIA = {
  AudioVolumeDown:0xEA, AudioVolumeMute:0xE2, AudioVolumeUp:0xE9,
  MediaTrackPrevious:0xB6, MediaPlayPause:0xCD, MediaTrackNext:0xB5, MediaStop:0xB7,
  BrightnessDown:0x70, BrightnessUp:0x6F,
  BrowserBack:0x224, BrowserHome:0x223, BrowserForward:0x225, BrowserSearch:0x221,
  MediaSelect:0x183, LaunchMail:0x18A, LaunchApp2:0x192,
};

const $ = s => document.querySelector(s);
const logEl = $('#log');
function say(m) {
  logEl.textContent += '[' + new Date().toTimeString().slice(0, 8) + '] ' + m + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

// ============ 键盘状态（浏览器维护，ESP32 零状态）============
let mods = 0, lockMod = false, mediaDown = null;
const keys = new Set();      // 当前按下的 usage
const held = new Set();      // 物理键盘防重复
const stick = new Set();     // 虚拟键盘上粘住的修饰键 code

// 只发 NKRO bitmap 帧（`n`）。固件那边会把它转成 6KRO 再写 USB，
// 所以 BIOS / 无驱动环境一样能用，不需要再切模式。
function sendKeys() {
  const rep = new Uint8Array(20);
  rep[0] = mods;
  for (const u of keys) {
    if (u <= 0 || u > 151) continue;
    const idx = 1 + (u >> 3);
    if (idx < 20) rep[idx] |= (1 << (u & 7));
  }
  let hex = '';
  for (let i = 0; i < 20; i++) hex += ('0' + rep[i].toString(16)).slice(-2);
  send('n ' + hex);
}

function press(code) {
  if (MEDIA[code] !== undefined) { mediaDown = MEDIA[code]; send('c ' + mediaDown); return; }
  if (MOD[code] !== undefined) { mods |= MOD[code]; sendKeys(); return; }
  const u = MAP[code];
  if (u === undefined) return;
  keys.add(u);
  sendKeys();
}
function release(code) {
  if (MEDIA[code] !== undefined) { mediaDown = null; send('c 0'); return; }
  if (MOD[code] !== undefined) { mods &= ~MOD[code]; sendKeys(); return; }
  const u = MAP[code];
  if (u === undefined) return;
  keys.delete(u);
  sendKeys();
}
function releaseAll() {
  mods = 0; keys.clear(); held.clear(); stick.clear(); mediaDown = null;
  document.querySelectorAll('.k.down,.k.mod.on').forEach(e => e.classList.remove('down', 'on'));
  sendKeys(); send('c 0'); say('已释放所有按键');
}
function tap(code) {   // 普通键：按下 → 松开
  press(code);
  setTimeout(() => {
    release(code);
    // 组合键用完自动松开修饰键（除非锁定）
    if (!lockMod && stick.size) {
      stick.forEach(c => { mods &= ~MOD[c]; });
      stick.clear();
      document.querySelectorAll('.k.mod.on').forEach(e => e.classList.remove('on'));
      sendKeys();
    }
  }, 45);
}

// ============ 鼠标 ============
let mbtn = 0;
function sendMouse(dx, dy, wheel) {
  dx = Math.max(-127, Math.min(127, Math.round(dx || 0)));
  dy = Math.max(-127, Math.min(127, Math.round(dy || 0)));
  send('m ' + mbtn + ' ' + dx + ' ' + dy + ' ' + (wheel || 0));
}

// ============ WebSocket：打开页面就自动连 ============
let ws = null, queue = [];
function send(s) {
  if (ws && ws.readyState === 1) ws.send(s);
  else if (queue.length < 50) queue.push(s);
}
function connect() {
  const url = 'ws://' + location.host + '/ws';
  ws = new WebSocket(url);
  ws.onopen = () => {
    $('#dot').className = 'on'; $('#st').textContent = '已连接';
    say('已连接 ' + url);
    while (queue.length) ws.send(queue.shift());
  };
  ws.onclose = () => {
    $('#dot').className = ''; $('#st').textContent = '已断开，3 秒后重连';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => { $('#dot').className = 'warn'; };
  ws.onmessage = ev => { if (ev.data && ev.data[0] !== '_') say('设备: ' + ev.data); };
}

// ============ 虚拟键盘布局 ============
// [code, 显示名, 宽度权重]  code=null 表示占位空格
const D = (c, l, w, alt) => [c, l, w || 1, alt];
const S = w => [null, '', w];           // 间隔
const LAYOUT = [
  [D('Escape','Esc',1.3), S(0.5),
   D('F1','F1'), D('F2','F2'), D('F3','F3'), D('F4','F4'), S(0.4),
   D('F5','F5'), D('F6','F6'), D('F7','F7'), D('F8','F8'), S(0.4),
   D('F9','F9'), D('F10','F10'), D('F11','F11'), D('F12','F12')],

  [D('Backquote','`',1,'~'), D('Digit1','1',1,'!'), D('Digit2','2',1,'@'), D('Digit3','3',1,'#'), D('Digit4','4',1,'$'),
   D('Digit5','5',1,'%'), D('Digit6','6',1,'^'), D('Digit7','7',1,'&'), D('Digit8','8',1,'*'), D('Digit9','9',1,'('),
   D('Digit0','0',1,')'), D('Minus','-',1,'_'), D('Equal','=',1,'+'), D('Backspace','⌫',2)],

  [D('Tab','Tab',1.5), D('KeyQ','Q'), D('KeyW','W'), D('KeyE','E'), D('KeyR','R'),
   D('KeyT','T'), D('KeyY','Y'), D('KeyU','U'), D('KeyI','I'), D('KeyO','O'),
   D('KeyP','P'), D('BracketLeft','[',1,'{'), D('BracketRight',']',1,'}'), D('Backslash','\\',1.5,'|')],

  [D('CapsLock','Caps',1.8), D('KeyA','A'), D('KeyS','S'), D('KeyD','D'), D('KeyF','F'),
   D('KeyG','G'), D('KeyH','H'), D('KeyJ','J'), D('KeyK','K'), D('KeyL','L'),
   D('Semicolon',';',1,':'), D('Quote','\'',1,'"'), D('Enter','Enter',2.2)],

  [D('ShiftLeft','Shift',2.3), D('KeyZ','Z'), D('KeyX','X'), D('KeyC','C'), D('KeyV','V'),
   D('KeyB','B'), D('KeyN','N'), D('KeyM','M'), D('Comma',',',1,'<'), D('Period','.',1,'>'),
   D('Slash','/',1,'?'), D('ShiftRight','Shift',2.7), S(0.6), D('ArrowUp','↑')],

  [D('ControlLeft','Ctrl',1.35), D('MetaLeft','Win',1.2), D('AltLeft','Alt',1.2),
   D('Space','Space',6.2), D('AltRight','Alt',1.2), D('MetaRight','Win',1.2),
   D('ContextMenu','☰',1.2), D('ControlRight','Ctrl',1.35), S(0.6),
   D('ArrowLeft','←'), D('ArrowDown','↓'), D('ArrowRight','→')],
];
// 上面这条是媒体键（走 Consumer Control）+ 常用编辑键（走键盘），
// 合成一组 chip：窄屏自动换行成两行，宽屏一行放得下。
// 去掉了 后退/主页/前进/播放器/邮件/计算器 —— 手机上基本用不到，还白占两行。
const MEDIALIST = [
  ['AudioVolumeDown','🔉'], ['AudioVolumeMute','🔇'], ['AudioVolumeUp','🔊'],
  ['MediaTrackPrevious','⏮'], ['MediaPlayPause','⏯'], ['MediaTrackNext','⏭'], ['MediaStop','⏹'],
  ['BrightnessDown','🔅'], ['BrightnessUp','🔆'],
  ['Insert','Ins'], ['Delete','Del'], ['Home','Home'], ['End','End'],
  ['PageUp','PgUp'], ['PageDown','PgDn'], ['PrintScreen','PrtSc'],
];

function mkKey(code, label, container, alt) {
  const el = document.createElement('div');
  el.className = 'k' + (MOD[code] !== undefined ? ' mod' : '');
  if (alt) {
    // 两层键帽：上排是 Shift 后的符号，下排是主字符
    el.dataset.alt = alt;
    const a = document.createElement('span'); a.className = 'alt'; a.textContent = alt;
    const b = document.createElement('span'); b.className = 'base'; b.textContent = label;
    el.appendChild(a); el.appendChild(b);
  } else {
    el.textContent = label;
  }
  el.dataset.code = code;
  container.appendChild(el);
  return el;
}

function buildKb() {
  const main = $('#main'), media = $('#media');
  for (const row of LAYOUT) {
    const r = document.createElement('div');
    r.className = 'row';
    for (const [code, label, w, alt] of row) {
      if (code === null) { const s = document.createElement('div'); s.style.flex = w; r.appendChild(s); continue; }
      const el = mkKey(code, label, r, alt);
      el.style.flex = w;
    }
    main.appendChild(r);
  }
  for (const [code, label] of MEDIALIST) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { press(code); setTimeout(() => release(code), 80); };
    media.appendChild(b);
  }
}

// ============ 虚拟键盘交互 ============
// pointer lock 状态下鼠标光标是隐藏的，点键盘时必须先解锁，否则点不到
function unlockForKeyboard() {
  if (document.pointerLockElement) document.exitPointerLock();
}

// ============ 双层键帽：长按出 Shift 符号 ============
// 数字/标点键上排是符号、下排是主字符。短按发主字符，按住 ~380ms 发符号。
// 实现上，带 alt 的键改成"松手才算数"，这样长按不会先打出一个原字符。
let altTimer = null, altCode = null, altFired = false;

function typeKey(code, shifted) {
  if (!shifted) { press(code); setTimeout(() => release(code), 60); return; }
  // 临时补一个左 Shift，发完恢复原状（不动"粘住"的修饰键状态）
  const saved = mods;
  mods |= MOD.ShiftLeft;
  sendKeys();
  setTimeout(() => {
    keys.add(MAP[code]); sendKeys();
    setTimeout(() => {
      keys.delete(MAP[code]);
      mods = saved;
      sendKeys();
    }, 60);
  }, 20);
}

function clearAlt() {
  if (altTimer) { clearTimeout(altTimer); altTimer = null; }
  altCode = null; altFired = false;
  document.querySelectorAll('.k.hold').forEach(x => x.classList.remove('hold'));
}

function bindKeys() {
  const kb = $('#kbwrap');
  kb.addEventListener('pointerdown', e => {
    const el = e.target.closest('.k');
    if (!el) return;
    e.preventDefault();
    unlockForKeyboard();
    const code = el.dataset.code;
    if (MOD[code] !== undefined) {          // 修饰键：点一下粘住，再点松开
      if (stick.has(code)) {
        stick.delete(code); mods &= ~MOD[code]; el.classList.remove('on');
      } else {
        stick.add(code); mods |= MOD[code]; el.classList.add('on');
      }
      sendKeys();
      return;
    }
    el.classList.add('down');
    if (el.dataset.alt) {                   // 双层键帽：先挂计时器，松手再决定发什么
      clearAlt();
      altCode = code;
      el.classList.add('hold');
      altTimer = setTimeout(() => {
        if (altCode !== code) return;
        altFired = true;
        el.classList.remove('down');
        typeKey(code, true);
      }, 380);
      return;
    }
    press(code);
  });
  kb.addEventListener('pointerup', e => {
    if (altCode) {                          // 双层键帽的收尾
      const code = altCode, fired = altFired;
      clearAlt();
      document.querySelectorAll('.k.down').forEach(x => x.classList.remove('down'));
      if (!fired) typeKey(code, false);     // 短按 -> 主字符；长按已经发过符号了
      if (!lockMod && stick.size) {
        stick.forEach(c => { mods &= ~MOD[c]; });
        stick.clear();
        document.querySelectorAll('.k.mod.on').forEach(x => x.classList.remove('on'));
        sendKeys();
      }
      return;
    }
    const el = e.target.closest('.k');
    if (!el || MOD[el.dataset.code] !== undefined) return;
    const code = el.dataset.code;
    el.classList.remove('down');
    release(code);
    if (!lockMod && stick.size) {
      stick.forEach(c => { mods &= ~MOD[c]; });
      stick.clear();
      document.querySelectorAll('.k.mod.on').forEach(x => x.classList.remove('on'));
      sendKeys();
    }
  });
  kb.addEventListener('pointercancel', () => { clearAlt(); releaseAll(); });
  kb.addEventListener('contextmenu', e => e.preventDefault());
}

// ============ 鼠标触控区 ============
const pad = $('#pad');
let dragging = false, lx = 0, ly = 0;

pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  // 已锁定时鼠标事件全被 pad 吃掉，所以这一下只用来解锁，
  // 解锁后第二下才能点到虚拟键盘（浏览器限制，没法在同一次点击里兼得）
  if (document.pointerLockElement) { document.exitPointerLock(); return; }
  if (pad.requestPointerLock) { try { pad.requestPointerLock(); } catch (_) {} }
  dragging = true; lx = e.clientX; ly = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; });
pad.addEventListener('pointermove', e => {
  if (document.pointerLockElement) { sendMouse(e.movementX, e.movementY, 0); return; }
  if (!dragging) return;
  sendMouse(e.clientX - lx, e.clientY - ly, 0);
  lx = e.clientX; ly = e.clientY;
});
pad.addEventListener('wheel', e => {
  e.preventDefault();
  sendMouse(0, 0, Math.max(-127, Math.min(127, -Math.round(e.deltaY / 12))));
}, { passive: false });
pad.addEventListener('contextmenu', e => e.preventDefault());

// 左/中/右键：按住 = 按下，松开 = 释放（便于拖拽）
function bindMouseBtn(id, bit) {
  const b = $(id);
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); unlockForKeyboard();
    mbtn |= bit; b.classList.add('on'); sendMouse(0, 0, 0);
  });
  window.addEventListener('pointerup', () => {
    if (mbtn & bit) { mbtn &= ~bit; b.classList.remove('on'); setTimeout(() => sendMouse(0, 0, 0), 30); }
  });
}
bindMouseBtn('#mL', 1); bindMouseBtn('#mR', 2); bindMouseBtn('#mM', 4);
$('#wU').addEventListener('pointerdown', () => sendMouse(0, 0, 3));
$('#wD').addEventListener('pointerdown', () => sendMouse(0, 0, -3));

// 触屏：单指移动 / 点击左键 / 双指滚轮
let tid = null, tlx = 0, tly = 0, lastTap = 0, twoY = 0;
pad.addEventListener('touchstart', e => {
  if (e.touches.length === 2) { twoY = (e.touches[0].clientY + e.touches[1].clientY) / 2; return; }
  tid = e.touches[0].identifier; tlx = e.touches[0].clientX; tly = e.touches[0].clientY;
  const now = Date.now();
  if (now - lastTap < 300) { mbtn |= 1; sendMouse(0, 0, 0); setTimeout(() => { mbtn &= ~1; sendMouse(0, 0, 0); }, 60); }
  lastTap = now;
}, { passive: true });
pad.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    sendMouse(0, 0, Math.round((twoY - y) / 8)); twoY = y; e.preventDefault(); return;
  }
  for (const t of e.changedTouches) {
    if (t.identifier !== tid) continue;
    sendMouse(t.clientX - tlx, t.clientY - tly, 0);
    tlx = t.clientX; tly = t.clientY;
  }
  e.preventDefault();
}, { passive: false });
pad.addEventListener('touchend', e => { if (!e.touches.length) tid = null; }, { passive: true });

// ============ 物理键盘（可选捕获）============
let captureKbd = false;
window.addEventListener('keydown', e => {
  if (!captureKbd || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  if (held.has(e.code)) return;
  held.add(e.code);
  press(e.code);
  const el = document.querySelector('.k[data-code="' + e.code + '"]');
  if (el) el.classList.add('down');
}, { capture: true });
window.addEventListener('keyup', e => {
  if (!captureKbd) return;
  e.preventDefault();
  held.delete(e.code);
  release(e.code);
  const el = document.querySelector('.k[data-code="' + e.code + '"]');
  if (el) el.classList.remove('down');
}, { capture: true });
window.addEventListener('blur', releaseAll);

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === pad) {
    pad.classList.add('live'); $('#st').textContent = '已连接 · 鼠标控制中';
  } else {
    pad.classList.remove('live'); $('#st').textContent = '已连接';
    releaseAll();
  }
});

// ============ 顶栏按钮 ============
$('#rel').onclick = releaseAll;

// 跳设置页前必须先关掉 WebSocket：一个网只有一个 socket，
// WS 占着的时候同一个地址上的 HTTP 会一直排队，页面看起来"打不开"。
function goSetup(e) {
  if (e) e.preventDefault();
  try { if (ws) ws.close(); } catch (_) {}
  setTimeout(function () { location.href = '/'; }, 250);
  return false;
}
$('#pwWake').onclick = function () { send('p wake'); say('已发出唤醒指令'); };
$('#pwSleep').onclick = function () { send('p sleep'); say('已发出睡眠指令'); };
$('#lockMod').onclick = function () {
  lockMod = !lockMod;
  this.classList.toggle('on', lockMod);
  say(lockMod ? '修饰键锁定：按完不会自动松开' : '修饰键按下一次后自动松开');
};
$('#capKbd').onclick = function () {
  captureKbd = !captureKbd;
  this.classList.toggle('on', captureKbd);
  say(captureKbd ? '已捕获本机物理键盘（Esc 无效，用按钮关）' : '已停止捕获本机键盘');
};
$('#kbdToggle').onclick = function () {
  const w = $('#kbwrap');
  w.classList.toggle('hide');
  this.textContent = w.classList.contains('hide') ? '显示键盘' : '隐藏键盘';
};

// ============ 启动：自动连接 ============
buildKb();
bindKeys();
$('#ip').textContent = location.host;
connect();
say('虚拟全键盘已就绪（点按键即发送，修饰键点一下粘住）');
setInterval(() => { if (ws && ws.readyState === 1) ws.send('_p'); }, 20000);
</script>
