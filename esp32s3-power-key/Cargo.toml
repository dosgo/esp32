[package]
name = "esp32s3-power-key"
version = "0.1.0"
edition = "2021"
resolver = "2"

# ESP32-S3 用 USB HID（Keyboard + System Control）+ WiFi 远程控制电脑休眠/唤醒
# 生态版本参考 esparrier：esp-hal 1.1.2 + esp-radio 0.18 + embassy-usb 0.6
#
# 为什么 esp-* 这一组停在 1.1 线（2026-10 核查过最新版）：
#   esp-hal 最新是 1.2.2，但 esp-radio 唯一能配 1.2 的版本是 1.0.0-beta.1，
#   beta.2 已被 yank。升 1.2 等于把整个 Wi-Fi/BLE 栈押在 beta 上，还要重写
#   ble.rs / otg_v1 / psram 那一堆 API，并重新移植 vendor 里的 trouble 补丁。
#   所以 esp-* 全家（hal / radio / rtos / alloc / storage / bootloader）
#   按同一代锁定：1.1.2 / 0.18 / 0.3 / 0.10 / 0.9 / 0.5。
# 其余与 esp-hal 无线耦合的（sha1 / esp-println / esp-backtrace / embedded-hal-bus）
# 已全部跟到最新。

[dependencies]
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "proto-ipv4",
    "medium-ethernet",
    "dhcpv4",
    "dns",
    "tcp",
    "udp",
] }
embassy-sync = "0.8.0"
embedded-io-async = "0.7"
embedded-storage = "0.3.1"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-usb = { version = "0.6.0", features = [
    "max-handler-count-4",
    "max-interface-count-4",
] }
# 只为了拿到 otg_v1::Otg，好直接操作 DCTL.RWUSIG 做硬件级远程唤醒。
# 版本必须和 esp-hal 内部用的一致（Cargo.lock 里就是 0.3.3），否则类型对不上。
embassy-usb-synopsys-otg = "0.3.3"
embassy-usb-driver = "0.2.2"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.20.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
# 锁死 =1.1.2：esp-radio 0.18 和 esp-storage 0.9 都只认 esp-hal 1.1.x，
# 不锁的话 cargo 会解出 1.2 然后两边打架
esp-hal = { version = "=1.1.2", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
# ble + coex：S3 的 Wi-Fi 与 BLE 共用一个射频，必须同时开 coex 才能并行跑
# unstable 是拿到 `ble::controller::BleConnector`（HCI 通道）的前置
esp-radio = { version = "0.18.0", features = [
    "esp32s3",
    "wifi",
    "ble",
    "coex",
    "unstable",
] }
# BLE 主机协议栈（纯 Rust，no_std）。0.6.0 依赖 bt-hci 0.8，
# 正好是 esp-radio 0.18 内置的那个版本，类型能直接对接。
# 不要 central/scan：这版只做外设（被手机连），省 flash 也省 RAM
trouble-host = { version = "0.6.0", default-features = false, features = [
    "peripheral",
    "gatt",
    "derive",
    # 安卓/iOS 连 HID 会强制走 SMP 配对，不开这个就卡在「正在配对」
    "security",
    # 让 trouble 内部的 error!/warn! 真的被编进来（走 main.rs 的环形 logger，
    # 没这行它内部的错误全都是空调用，排查配对问题时抓瞎）
    "log",
    "default-packet-pool",
    # 包池 8 包 × 251 字节。**MTU 不能压到 64**：
    # SMP 配对（Secure Connections 的 P-256 公钥）单个 PDU 要 65 字节，
    # 64 的 MTU 会让 trouble 直接报 `InsufficientSpace`，
    # 现象就是手机一直卡在「正在配对」。
    "default-packet-pool-size-8",
    "default-packet-pool-mtu-251",
] }
bt-hci = "0.8"
# trouble 0.6 内部用的是 embassy-sync 0.7，而本工程主体是 0.8。
# GATT 属性表的锁类型必须和 trouble 那一份对上，所以单独引一个 0.7 改个名字。
embassy-sync-07 = { package = "embassy-sync", version = "0.7" }
# 给 trouble 的 security manager 播种 CSPRNG（版本要和 trouble 用的 0.6 一致）
rand_core = "0.6"
# 直接点 SENS 寄存器读片上温度（esp-hal 1.1.2 没给 S3 实现 tsens）。
# 版本必须跟 esp-hal 1.1.2 内部用的一致（0.35.2），否则寄存器类型对不上。
esp32s3 = "0.35.2"
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
# 热点模式必须自己跑 DHCP：embassy-net 只有客户端，没有服务端
esp-hal-dhcp-server = "0.4.3"
# WiFi 账号密码存 flash，掉电不丢（换 WiFi 不用重新烧固件）
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
heapless = "0.9.3"
static_cell = "2.1.1"
log = "0.4.34"
# WebSocket 握手要 SHA1（控制页走 WS 收键鼠），纯 no_std，无 alloc
# 0.11 走 digest 0.11（hybrid-array），new/update/finalize 用法不变
sha1 = { version = "0.11", default-features = false }

# ---- LCD：0.96" ST7735S 80x160（T-Dongle-S3 同款接线）----
mipidsi = { version = "0.10", default-features = false }
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"

[profile.release]
opt-level = "s"
codegen-units = 1

# vendor 了一份 trouble-host（见 vendor/trouble-host），只为一处补丁：
# 外设侧配对时主动索取对方的 IRK，否则手机轮换随机地址后重连必然 Authentication Failure。
# 上游修好之后把这段删掉、改回 registry 版本即可。
[patch.crates-io]
trouble-host = { path = "vendor/trouble-host" }
