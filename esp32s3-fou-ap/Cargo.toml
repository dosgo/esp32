[package]
name = "esp32s3-fou-ap"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "proto-ipv4",
    "medium-ethernet",
    # 上行 Wi-Fi（STA）要 DHCP 客户端从上游路由器要地址
    "dhcpv4",
    "tcp",
    "udp",
    # 让 192.168.4.1 能回 ping：这是本机自己的地址，走协议栈本地应答，不进隧道
    "auto-icmp-echo-reply",
] }
embassy-net-driver = "0.2.0"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embedded-graphics = "0.8"
embedded-hal-bus = "0.2"
embedded-io-async = "0.7"
esp-alloc = "0.10.0"
esp-wifi-sys-esp32s3 = "0.2.0"
esp-backtrace = { version = "0.19.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.2", features = ["esp32s3", "unstable"] }
esp-hal-dhcp-server = "0.4.3"
edge-dhcp = { version = "0.8.0", default-features = false }
esp-println = { version = "0.17.0", default-features = false, features = [
    "esp32s3",
    "auto",
    "log-04",
] }
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
heapless = "0.9.3"
log = "0.4.34"
mipidsi = { version = "0.10", default-features = false }
static_cell = "2.1.1"

[profile.release]
# 数据面全是 memcpy / 协议栈解析，速度优先比体积优先更划算（flash 16MB 用不完）
opt-level = 3
codegen-units = 1
